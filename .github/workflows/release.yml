name: Release Package

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0

env:
  CARGO_TERM_COLOR: always

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Nix Magic Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Install React Native app dependencies
        run: nix develop .# --command bash -c "yarn install --immutable"

      - name: Build example Android app
        run: nix develop .# --command bash -c "yarn example build:android"

  build_ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Prebuild iOS example
        run: yarn example ios:prebuild

      - name: Build example iOS app
        run: yarn example build:ios:xcode

  publish_npm_and_github_release:
    runs-on: ubuntu-latest
    needs:
      - build_android
      - build_ios
    permissions:
      contents: write # Required to create a release and upload assets
      id-token: write # Required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }} # Checkout the specific tag
          fetch-depth: 0 # release-it needs full history

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm trusted publishing (OIDC) requires npm CLI >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Prepare package for release
        run: yarn prepare

      # No NPM_TOKEN: npm authenticates via GitHub OIDC and publishes with provenance.
      - name: Publish to npm and Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}" # Strip 'v' prefix if present
          echo "Releasing version: $VERSION based on tag: $TAG_NAME"
          yarn release "$VERSION" --ci --no-git
